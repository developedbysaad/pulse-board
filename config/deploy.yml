<% begin; require "dotenv"; Dotenv.load(".env"); rescue LoadError; end %>

service: <%= ENV.fetch('KAMAL_SERVICE', 'pulse-board') %>

image: <%= ENV.fetch('KAMAL_IMAGE', "#{ENV.fetch('GITHUB_REPOSITORY_OWNER', 'developedbysaad')}/#{ENV.fetch('KAMAL_SERVICE', 'pulse-board')}") %>

servers:
  web:
    hosts:
      - <%= ENV['KAMAL_SERVER_HOST'] %>
    cmd: node backend/src/index.js

proxy:
  ssl: true
  app_port: <%= ENV.fetch('APP_PORT', 3000) %>
  host: <%= ENV['KAMAL_DEPLOY_HOST'] %>
  healthcheck:
    path: /api/health
    interval: 5
    timeout: 3

registry:
  server: <%= ENV.fetch('KAMAL_REGISTRY_SERVER', 'ghcr.io') %>
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  cache:
    type: registry
    image: <%= ENV.fetch('KAMAL_BUILD_CACHE_IMAGE', "#{ENV.fetch('GITHUB_REPOSITORY_OWNER', 'developedbysaad')}/#{ENV.fetch('KAMAL_SERVICE', 'pulse-board')}-buildcache") %>

env:
  clear:
    NODE_ENV: production
    PORT: <%= ENV.fetch('APP_PORT', 3000) %>
    RATE_LIMIT_WINDOW_MS: <%= ENV.fetch('RATE_LIMIT_WINDOW_MS', 900000) %>
    RATE_LIMIT_MAX: <%= ENV.fetch('RATE_LIMIT_MAX', 100) %>
  secret:
    - SESSION_SECRET
    - CSRF_SECRET
    - COOKIE_SECRET
    - DATABASE_URL
    - PUBLIC_ORIGIN
    - BREVO_API_KEY
    - BREVO_SENDER_EMAIL
    - BREVO_SENDER_NAME
    - GUEST_DEMO_EMAIL
    - GUEST_DEMO_PASSWORD

accessories:
  db:
    image: postgres:17
    host: <%= ENV['KAMAL_SERVER_HOST'] %>
    env:
      clear:
        POSTGRES_USER: <%= ENV.fetch('POSTGRES_USER', 'pulse') %>
        POSTGRES_DB: <%= ENV.fetch('POSTGRES_DB', 'pulse_board_production') %>
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

asset_path: /app/frontend/dist
