<%
  begin
    require "dotenv"
    Dotenv.load(".env")
  rescue LoadError
  end

  def env_or(key, fallback = nil)
    v = ENV[key]
    v && !v.empty? ? v : fallback
  end
%>

service: <%= env_or('KAMAL_SERVICE', 'pulse-board') %>

image: <%= env_or('KAMAL_IMAGE') || "#{env_or('KAMAL_REGISTRY_USERNAME', 'developedbysaad')}/#{env_or('KAMAL_SERVICE', 'pulse-board')}" %>

servers:
  web:
    hosts:
      - <%= ENV['KAMAL_SERVER_HOST'] %>
    cmd: node backend/src/index.js

proxy:
  ssl: true
  app_port: <%= env_or('APP_PORT', 3000) %>
  host: <%= ENV['KAMAL_DEPLOY_HOST'] %>
  healthcheck:
    path: /api/health
    interval: 5
    timeout: 3

registry:
  server: <%= env_or('KAMAL_REGISTRY_SERVER', 'index.docker.io') %>
  username: <%= env_or('KAMAL_REGISTRY_USERNAME') %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  cache:
    type: registry
    image: <%= env_or('KAMAL_BUILD_CACHE_IMAGE') || "#{env_or('KAMAL_REGISTRY_USERNAME', 'developedbysaad')}/#{env_or('KAMAL_SERVICE', 'pulse-board')}-buildcache" %>

env:
  clear:
    NODE_ENV: production
    PORT: <%= env_or('APP_PORT', 3000) %>
    RATE_LIMIT_WINDOW_MS: <%= env_or('RATE_LIMIT_WINDOW_MS', 900000) %>
    RATE_LIMIT_MAX: <%= env_or('RATE_LIMIT_MAX', 100) %>
  secret:
    - SESSION_SECRET
    - CSRF_SECRET
    - COOKIE_SECRET
    - DATABASE_URL
    - PUBLIC_ORIGIN
    - BREVO_API_KEY
    - BREVO_SENDER_EMAIL
    - BREVO_SENDER_NAME
    - GUEST_DEMO_EMAIL
    - GUEST_DEMO_PASSWORD

accessories:
  db:
    image: postgres:17
    host: <%= ENV['KAMAL_SERVER_HOST'] %>
    env:
      clear:
        POSTGRES_USER: <%= env_or('POSTGRES_USER', 'pulse') %>
        POSTGRES_DB: <%= env_or('POSTGRES_DB', 'pulse_board_production') %>
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

asset_path: /app/frontend/dist
