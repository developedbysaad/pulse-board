name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest

    # Use a GitHub Environment so secrets can be gated behind a
    # required-reviewer rule (Settings → Environments → production).
    environment:
      name: production
      url: https://${{ secrets.KAMAL_DEPLOY_HOST }}

    env:
      # ghcr.io registry creds — auto-injected, no manual secret needed.
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Host + domain — resolved via ERB in config/deploy.yml.
      KAMAL_DEPLOY_HOST: ${{ secrets.KAMAL_DEPLOY_HOST }}
      KAMAL_SERVER_HOST: ${{ secrets.KAMAL_SERVER_HOST }}

      # Postgres — feeds the accessory's POSTGRES_PASSWORD and the
      # DATABASE_URL composed in .kamal/secrets.
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      # Core app secrets.
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
      PUBLIC_ORIGIN: https://${{ secrets.KAMAL_DEPLOY_HOST }}

      # Email (Brevo) — optional; without these the app still boots,
      # "publish results" emails just become no-ops.
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

      # Demo seed credentials — used by `npm run db:seed` if ever run.
      GUEST_DEMO_EMAIL: ${{ secrets.GUEST_DEMO_EMAIL }}
      GUEST_DEMO_PASSWORD: ${{ secrets.GUEST_DEMO_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby (Kamal is a Ruby gem)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v 2.11.0 --no-document

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.KAMAL_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy with Kamal
        run: kamal deploy
        env:
          VERSION: ${{ github.sha }}

      - name: Summary
        if: success()
        run: |
          echo "### Deployed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://${{ secrets.KAMAL_DEPLOY_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docs: https://${{ secrets.KAMAL_DEPLOY_HOST }}/docs/" >> $GITHUB_STEP_SUMMARY
